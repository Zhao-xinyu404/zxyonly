plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wuliao.chat'
    compileSdk 34

    defaultConfig {
        applicationId "com.wuliao.chat"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
